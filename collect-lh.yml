name: Collect LH floorplans
on:
  workflow_dispatch:
  schedule:
    - cron: '20 18 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python collector_lh.py
      - name: Commit collected data
        run: |
          git config user.name "mecca-move-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/verified_floorplans_cumulative.json data/collector_state.json
          git diff --cached --quiet || git commit -m "Update LH floorplan database"
          git push
